<!
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Missoes</title>
</head>
<body>
<h1>Lista de misssoes</h1>
    <table>
        <thead>
        <tr>
            <th>Id</th>
            <th>Nome</th>
            <th>Dificuldade</th>
            <th>Ninjas Fazendo a missão</th>
        </tr>
        </thead>
        <tbody>
            <tr th:each="missao : ${missoes}">
                <td th:text="${missao.id}"></td>
                <td th:text="${missao.nome}"></td>
                <td th:text="${missao.dificuldade}"></td>
                <td th:text="${missao.ninjas}"></td>
            </tr>


        </tbody>

    </table>
</body>
</html>
